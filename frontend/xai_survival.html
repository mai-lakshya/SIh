<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAI & Survival Analysis | Risk Factor Profile</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Canonical Project Explainability Dataset: Exact same dataset consumed by both charts
    const CURRENT_PROJECT_DATA = [
      { factor: "Protest & Agitation Risk Factor (P_r)", project: 17, benchmark: 5 },
      { factor: "Population Density", project: -7, benchmark: -2 },
      { factor: "State", project: 6, benchmark: 2 },
      { factor: "District", project: -5, benchmark: -1 },
      { factor: "Log Land Area", project: 6, benchmark: 2 }
    ];

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = ((angleInDegrees - 90) * Math.PI) / 180.0;
      return {
        x: centerX + radius * Math.cos(angleInRadians),
        y: centerY + radius * Math.sin(angleInRadians)
      };
    }

    /**
     * Corrected RiskFactorRadarChart Component with Recentered Scale Logic
     */
    function RiskFactorRadarChart({
      data = CURRENT_PROJECT_DATA,
      sourceBarData = null,
      title = "Risk Factor Profile",
      subtitle = "How this project compares to the portfolio average",
      onFactorClick,
      isLoading = false,
      error = null,
      onRetry = null,
      className = ""
    }) {
      const [hoveredIndex, setHoveredIndex] = useState(null);
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
      const [animScale, setAnimScale] = useState(0);

      useEffect(() => {
        const timer = setTimeout(() => setAnimScale(1), 50);
        return () => clearTimeout(timer);
      }, []);

      // Dev-mode assertion running on data updates
      useEffect(() => {
        if (sourceBarData && data) {
          const barMap = new Map();
          sourceBarData.forEach(d => {
            const val = d.project !== undefined ? d.project : d.pts;
            barMap.set(d.factor.trim().toLowerCase(), val);
          });
          data.forEach(d => {
            const key = d.factor.trim().toLowerCase();
            if (barMap.has(key)) {
              const trueVal = barMap.get(key);
              if (Math.abs(d.project - trueVal) > 0.5) {
                console.error(`RiskFactorRadarChart data mismatch: ${d.factor} shows ${d.project} but source data has ${trueVal}`);
              }
            }
          });
        }
      }, [data, sourceBarData]);

      // 1. Calculate dynamic symmetric limit: Math.ceil(Math.max(...data.flatMap(...)) / 5) * 5
      const maxAbsImpact = useMemo(() => {
        if (!data || data.length === 0) return 5;
        const vals = data.flatMap(d => [Math.abs(d.project || 0), Math.abs(d.benchmark || 0)]);
        const maxObs = Math.max(...vals, 0);
        return Math.ceil(maxObs / 5) * 5;
      }, [data]);

      // 2. Transform raw signed impact into 0-100 radial scale
      const toRadialScale = (val) => {
        if (maxAbsImpact <= 0) return 50;
        const radial = 50 + (val / maxAbsImpact) * 50;
        return Math.max(0, Math.min(100, radial));
      };

      // 3. Derive dynamic executive summary using signed driver and mitigator
      const executiveSummary = useMemo(() => {
        if (!data || data.length === 0) return null;

        let topDriver = null;
        let maxPos = 0;
        let topMitigator = null;
        let maxNeg = 0;

        data.forEach(item => {
          if (item.project > maxPos) {
            maxPos = item.project;
            topDriver = item;
          }
          if (item.project < maxNeg) {
            maxNeg = item.project;
            topMitigator = item;
          }
        });

        if (topDriver && topMitigator) {
          return `This project's risk is being pushed up most by ${topDriver.factor} (+${Math.round(topDriver.project)} pts) — while ${topMitigator.factor} is working in its favor (${Math.round(topMitigator.project)} pts).`;
        } else if (topDriver) {
          return `This project's risk is being pushed up most by ${topDriver.factor} (+${Math.round(topDriver.project)} pts), with no major protective mitigators detected.`;
        } else if (topMitigator) {
          return `All evaluated dimensions are protective or neutral, led by ${topMitigator.factor} (${Math.round(topMitigator.project)} pts).`;
        }
        return "This project's factor attribution profile shows neutral impact across all evaluated dimensions.";
      }, [data]);

      if (isLoading) {
        return (
          <div className="bg-white rounded-lg border border-gray-200 p-6 shadow-sm flex flex-col justify-between h-full min-h-[460px] animate-pulse">
            <div>
              <div className="h-6 w-48 bg-gray-200 rounded mb-2" />
              <div className="h-4 w-72 bg-gray-100 rounded mb-4" />
              <div className="h-10 bg-blue-50/50 rounded mb-6" />
            </div>
            <div className="flex-1 flex items-center justify-center">
              <div className="w-52 h-52 rounded-full border-4 border-dashed border-gray-200 animate-spin" />
            </div>
            <div className="h-4 w-52 bg-gray-100 rounded mx-auto" />
          </div>
        );
      }

      if (error) {
        return (
          <div className="bg-white rounded-lg border border-gray-200 p-6 shadow-sm flex flex-col justify-between h-full min-h-[460px]">
            <div>
              <h3 className="text-base font-bold text-gray-900">{title}</h3>
              <div className="border-b border-gray-200 my-4" />
            </div>
            <div className="flex-1 flex flex-col items-center justify-center text-center p-6 bg-red-50 rounded-lg">
              <p className="text-sm font-semibold text-red-800">Failed to load risk profile</p>
              <p className="text-xs text-red-600 mt-1 mb-4">{error}</p>
              {onRetry && (
                <button onClick={onRetry} className="px-3.5 py-1.5 text-xs font-semibold text-white bg-red-600 rounded-md">
                  Retry
                </button>
              )}
            </div>
          </div>
        );
      }

      if (!data || data.length < 3) {
        return (
          <div className="bg-white rounded-lg border border-gray-200 p-6 shadow-sm flex flex-col justify-between h-full min-h-[460px]">
            <h3 className="text-base font-bold text-gray-900">{title}</h3>
            <div className="flex-1 flex items-center justify-center text-center text-gray-500 text-sm">
              Not enough factor data to display the risk profile
            </div>
          </div>
        );
      }

      // Geometry configuration
      const size = 380;
      const center = size / 2;
      const radius = 135;
      const totalAxes = data.length;
      const angleStep = 360 / totalAxes;

      // Compute polygon vertices with recentered radial scaling
      const projectCoords = data.map((d, i) => {
        const radScore = toRadialScale(d.project);
        const r = (radScore / 100) * radius * animScale;
        return polarToCartesian(center, center, r, i * angleStep);
      });

      const benchmarkCoords = data.map((d, i) => {
        const radScore = toRadialScale(d.benchmark);
        const r = (radScore / 100) * radius * animScale;
        return polarToCartesian(center, center, r, i * angleStep);
      });

      const projectPath = projectCoords.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ') + ' Z';
      const benchmarkPath = benchmarkCoords.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ') + ' Z';

      const activeItem = hoveredIndex !== null ? data[hoveredIndex] : null;

      return (
        <div
          className={`bg-white rounded-lg border border-gray-200 p-5 sm:p-6 shadow-sm flex flex-col justify-between h-full min-h-[460px] relative select-none ${className}`}
          role="region"
          aria-label={executiveSummary || title}
        >
          {/* 1. Header Block */}
          <div>
            <div className="flex items-start justify-between">
              <div>
                <h3 className="text-base sm:text-lg font-bold text-gray-900 tracking-tight">{title}</h3>
                {subtitle && <p className="text-xs sm:text-sm text-gray-500 mt-0.5">{subtitle}</p>}
              </div>
            </div>

            <div className="border-b border-gray-200 mt-3.5 mb-3" />

            {/* 2. Executive Finding Callout Pill */}
            {executiveSummary && (
              <div className="bg-blue-50/90 border-l-4 border-blue-600 rounded-r-md px-3.5 py-2 mb-3 text-xs sm:text-[13px] text-blue-900 font-medium flex items-center gap-2">
                <svg className="w-4 h-4 text-blue-600 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                </svg>
                <span>
                  <strong className="font-semibold">Executive Finding:</strong> {executiveSummary}
                </span>
              </div>
            )}
          </div>

          {/* 3. Interactive SVG Radar Area */}
          <div
            className="flex-1 w-full min-h-[340px] flex items-center justify-center relative"
            onMouseMove={(e) => {
              const rect = e.currentTarget.getBoundingClientRect();
              setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            }}
          >
            <svg
              viewBox={`0 0 ${size} ${size}`}
              className="w-full h-full max-w-[420px] max-h-[420px] overflow-visible"
            >
              {/* Outer Ring (100) */}
              {(() => {
                const ringPoints = Array.from({ length: totalAxes }).map((_, i) => {
                  const pt = polarToCartesian(center, center, radius, i * angleStep);
                  return `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
                }).join(' ') + ' Z';
                return (
                  <path d={ringPoints} fill="none" stroke="#e5e7eb" strokeDasharray="2 2" strokeWidth={1} />
                );
              })()}

              {/* Distinct Dashed NEUTRAL RING at r=50% */}
              {(() => {
                const neutralRadius = radius * 0.5;
                const neutralPoints = Array.from({ length: totalAxes }).map((_, i) => {
                  const pt = polarToCartesian(center, center, neutralRadius, i * angleStep);
                  return `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
                }).join(' ') + ' Z';
                return (
                  <g key="neutral-ring">
                    <path
                      d={neutralPoints}
                      fill="none"
                      stroke="#9ca3af"
                      strokeDasharray="4 4"
                      strokeWidth={1.5}
                    />
                    {/* Neutral Ring Label */}
                    <text
                      x={center + 4}
                      y={center - neutralRadius + 9}
                      className="fill-gray-600 text-[9px] font-sans font-bold select-none"
                    >
                      0 pts (neutral)
                    </text>
                  </g>
                );
              })()}

              {/* Outer Ring Label (+maxAbsImpact) */}
              <text
                x={center + 4}
                y={center - radius + 9}
                className="fill-gray-400 text-[9px] font-sans font-medium select-none"
              >
                +{maxAbsImpact} pts (higher risk)
              </text>

              {/* Center Label (-maxAbsImpact) */}
              <text
                x={center + 4}
                y={center - 3}
                className="fill-gray-400 text-[9px] font-sans font-medium select-none"
              >
                -{maxAbsImpact} pts (lower risk)
              </text>

              {/* Radial Spokes */}
              {data.map((item, i) => {
                const outerPt = polarToCartesian(center, center, radius, i * angleStep);
                const labelPt = polarToCartesian(center, center, radius + 22, i * angleStep);
                const isHovered = hoveredIndex === i;

                const rawName = item.factor;
                const maxLen = 18;
                const truncated = rawName.length > maxLen ? rawName.slice(0, maxLen - 2) + '…' : rawName;

                let anchor = "middle";
                if (labelPt.x > center + 12) anchor = "start";
                else if (labelPt.x < center - 12) anchor = "end";

                return (
                  <g key={`spoke-${i}`}>
                    <line
                      x1={center}
                      y1={center}
                      x2={outerPt.x}
                      y2={outerPt.y}
                      stroke="#e5e7eb"
                      strokeWidth={1}
                    />
                    {/* Axis Label */}
                    <text
                      x={labelPt.x}
                      y={labelPt.y + (labelPt.y > center ? 4 : -2)}
                      textAnchor={anchor}
                      className={`text-[11px] sm:text-[12px] transition-colors cursor-pointer select-none font-sans ${
                        isHovered
                          ? 'fill-gray-900 font-bold underline'
                          : 'fill-gray-600 font-medium'
                      }`}
                      onClick={() => onFactorClick && onFactorClick(item.factor)}
                      onMouseEnter={() => setHoveredIndex(i)}
                      onMouseLeave={() => setHoveredIndex(null)}
                    >
                      <title>{item.factor}</title>
                      {truncated}
                    </text>
                  </g>
                );
              })}

              {/* Portfolio Average Polygon: Dashed Teal Line (#0d9488) */}
              <path
                d={benchmarkPath}
                fill="#0d9488"
                fillOpacity={0.05}
                stroke="#0d9488"
                strokeWidth={1.75}
                strokeDasharray="4 4"
                className="transition-all duration-500 ease-out"
              />

              {/* This Project Polygon: Neutral Gray Stroke (#4b5563) with Light Fill */}
              <path
                d={projectPath}
                fill="rgba(75, 85, 99, 0.06)"
                stroke="#4b5563"
                strokeWidth={2}
                className="transition-all duration-500 ease-out"
              />

              {/* Benchmark Vertices */}
              {benchmarkCoords.map((pt, i) => {
                const bmVal = data[i].benchmark;
                const bmColor = bmVal > 0 ? '#ef5350' : bmVal < 0 ? '#26a69a' : '#6b7280';
                return (
                  <circle
                    key={`bm-dot-${i}`}
                    cx={pt.x}
                    cy={pt.y}
                    r={hoveredIndex === i ? 4.5 : 3}
                    fill="#ffffff"
                    stroke={bmColor}
                    strokeWidth={1.5}
                    strokeDasharray="2 2"
                    className="transition-all duration-200"
                  />
                );
              })}

              {/* This Project Vertices Colored Strictly by Sign */}
              {projectCoords.map((pt, i) => {
                const isHovered = hoveredIndex === i;
                const projVal = data[i].project;
                const dotColor = projVal > 0 ? '#ef5350' : projVal < 0 ? '#26a69a' : '#6b7280';

                return (
                  <g key={`proj-dot-${i}`}>
                    {/* Outer glow ring on hover */}
                    {isHovered && (
                      <circle cx={pt.x} cy={pt.y} r={10} fill={dotColor} fillOpacity={0.25} />
                    )}
                    <circle
                      cx={pt.x}
                      cy={pt.y}
                      r={isHovered ? 7 : 4.5}
                      fill={dotColor}
                      stroke="#ffffff"
                      strokeWidth={isHovered ? 2.5 : 2}
                      className="transition-all duration-200 shadow"
                    />
                    {/* Invisible Hit Zone */}
                    <circle
                      cx={pt.x}
                      cy={pt.y}
                      r={15}
                      fill="transparent"
                      className="cursor-pointer"
                      onClick={() => onFactorClick && onFactorClick(data[i].factor)}
                      onMouseEnter={() => setHoveredIndex(i)}
                      onMouseLeave={() => setHoveredIndex(null)}
                    />
                  </g>
                );
              })}
            </svg>

            {/* Custom Tooltip Card Displaying Original Signed Points */}
            {activeItem && (
              <div
                className="absolute pointer-events-none bg-white p-3.5 rounded-lg shadow-xl border border-gray-100 text-xs min-w-[220px] z-50 transition-transform duration-75"
                style={{
                  left: `${Math.min(Math.max(mousePos.x - 110, 10), 220)}px`,
                  top: `${Math.max(mousePos.y - 130, 10)}px`,
                }}
              >
                <div className="font-semibold text-gray-900 border-b border-gray-100 pb-1.5 mb-2">
                  {activeItem.factor}
                </div>

                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1.5 text-gray-600">
                      <span
                        className="w-2.5 h-2.5 rounded-full inline-block"
                        style={{ backgroundColor: activeItem.project > 0 ? '#ef5350' : activeItem.project < 0 ? '#26a69a' : '#6b7280' }}
                      />
                      <span>This Project:</span>
                    </div>
                    <span
                      className="font-bold"
                      style={{ color: activeItem.project > 0 ? '#ef5350' : activeItem.project < 0 ? '#26a69a' : '#6b7280' }}
                    >
                      {activeItem.project > 0 ? `+${activeItem.project} pts` : `${activeItem.project} pts`}
                    </span>
                  </div>
                  <div className="text-[10px] text-gray-400 pl-4 -mt-0.5">
                    ({activeItem.project > 0 ? 'risk-increasing / outside ring' : activeItem.project < 0 ? 'risk-reducing / inside ring' : 'neutral'})
                  </div>

                  <div className="flex items-center justify-between pt-1">
                    <div className="flex items-center gap-1.5 text-gray-600">
                      <span className="w-2.5 h-2.5 rounded-full border border-dashed border-[#0d9488] bg-[#0d9488]/10 inline-block" />
                      <span>Portfolio Average:</span>
                    </div>
                    <span className="font-medium text-gray-700">
                      {activeItem.benchmark > 0 ? `+${activeItem.benchmark} pts` : `${activeItem.benchmark} pts`}
                    </span>
                  </div>
                </div>

                <div className="mt-2.5 pt-2 border-t border-gray-100 flex items-center justify-between">
                  <span className="text-gray-500 font-medium">Variance vs Avg:</span>
                  {(() => {
                    const delta = activeItem.project - activeItem.benchmark;
                    return (
                      <span
                        className={`font-semibold px-1.5 py-0.5 rounded text-[11px] ${
                          delta > 0
                            ? 'text-red-700 bg-red-50 border border-red-200'
                            : delta < 0
                            ? 'text-teal-800 bg-teal-50 border border-teal-200'
                            : 'text-gray-600 bg-gray-50 border border-gray-200'
                        }`}
                      >
                        {delta > 0 ? `+${Math.round(delta)} pts (higher risk)` : delta < 0 ? `${Math.round(delta)} pts (more protective)` : 'Equal to avg'}
                      </span>
                    );
                  })()}
                </div>
              </div>
            )}
          </div>

          {/* 4. Centered Legend & Sign Decoding */}
          <div className="flex flex-wrap items-center justify-center gap-5 pt-2 pb-1 text-xs text-gray-600">
            <div className="flex items-center gap-1.5 select-none">
              <span className="w-2.5 h-2.5 rounded-full bg-[#ef5350] inline-block" />
              <span className="font-semibold text-gray-800">Risk-Increasing (+)</span>
            </div>

            <div className="flex items-center gap-1.5 select-none">
              <span className="w-2.5 h-2.5 rounded-full bg-[#26a69a] inline-block" />
              <span className="font-semibold text-gray-800">Risk-Reducing (-)</span>
            </div>

            <div className="flex items-center gap-1.5 select-none pl-2 border-l border-gray-200">
              <span className="w-3.5 h-0.5 bg-[#4b5563] inline-block" />
              <span className="font-medium text-gray-700">This Project</span>
            </div>

            <div className="flex items-center gap-1.5 select-none">
              <span className="w-3.5 border-t-2 border-dashed border-[#0d9488] inline-block" />
              <span className="font-medium text-gray-700">Portfolio Average</span>
            </div>
          </div>

          {/* 5. How to Read This Footer */}
          <div className="border-t border-gray-100 mt-2.5 pt-2.5">
            <p className="text-[11px] leading-relaxed text-gray-500 font-normal">
              <strong className="font-semibold text-gray-700">How to read this:</strong> Points outside the dashed neutral ring are pushing this project's risk up (red); points inside it are pulling risk down (green). The further from the neutral ring, the bigger the effect. Compare the solid line (this project) to the dashed line (portfolio average) to see where this project deviates from typical.
            </p>
          </div>
        </div>
      );
    }

    const SURVIVAL_CURVE_DATA = [
      { day: 0, prob: 1.0, label: "Day 0" },
      { day: 30, prob: 0.96, label: "1 Mo" },
      { day: 60, prob: 0.91, label: "2 Mo" },
      { day: 90, prob: 0.84, label: "3 Mo" },
      { day: 120, prob: 0.76, label: "4 Mo" },
      { day: 180, prob: 0.60, label: "6 Mo" },
      { day: 240, prob: 0.45, label: "8 Mo" },
      { day: 300, prob: 0.35, label: "10 Mo" },
      { day: 365, prob: 0.26, label: "1 Yr" },
      { day: 500, prob: 0.12, label: "16 Mo" },
      { day: 730, prob: 0.04, label: "2 Yrs" }
    ];

    /**
     * Interactive When Is This Project Most Likely to Stall? Survival Curve
     */
    function ProjectSurvivalChart({
      data = SURVIVAL_CURVE_DATA,
      title = "When Is This Project Most Likely to Stall?",
      subtitle = "Likelihood this project stays on track over the next 2 years"
    }) {
      const [hoveredPoint, setHoveredPoint] = useState(null);
      const width = 520;
      const height = 300;
      const padLeft = 46;
      const padRight = 24;
      const padTop = 24;
      const padBottom = 38;

      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const getX = (idx) => padLeft + (idx / (data.length - 1)) * plotW;
      const getY = (prob) => padTop + (1 - prob) * plotH;

      let maxDropRate = -1;
      let steepestIdx = 0;
      for (let i = 0; i < data.length - 1; i++) {
        const dt = (data[i + 1].day - data[i].day) || 1;
        const ds = (data[i].prob - data[i + 1].prob);
        const rate = ds / dt;
        if (rate > maxDropRate) {
          maxDropRate = rate;
          steepestIdx = i;
        }
      }

      const points = data.map((d, i) => `${getX(i)},${getY(d.prob)}`).join(' ');
      const areaPath = `M ${getX(0)},${getY(data[0].prob)} L ${points} L ${getX(data.length - 1)},${padTop + plotH} L ${getX(0)},${padTop + plotH} Z`;

      const bandXStart = getX(steepestIdx);
      const bandXEnd = getX(steepestIdx + 1);

      return (
        <div className="bg-white rounded-lg border border-gray-200 p-5 sm:p-6 shadow-sm flex flex-col justify-between h-full min-h-[460px]">
          <div>
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-base sm:text-lg font-bold text-gray-900 tracking-tight">
                  {title}
                </h3>
                <p className="text-xs sm:text-sm text-gray-500 mt-0.5">
                  {subtitle}
                </p>
              </div>
              <span className="px-2.5 py-1 text-[11px] font-semibold text-amber-800 bg-amber-50 border border-amber-200 rounded-md">
                Critical: Day {data[steepestIdx].day}–{data[steepestIdx + 1].day}
              </span>
            </div>
            <div className="border-b border-gray-200 mt-3.5 mb-4" />
          </div>

          <div className="mb-3 px-3.5 py-2.5 bg-blue-50/70 border-l-4 border-blue-500 rounded-md text-xs text-gray-700 leading-relaxed">
            <strong className="text-blue-700">Survival Dynamics:</strong> Project stability drops sharpest between <strong>Day {data[steepestIdx].day} and Day {data[steepestIdx + 1].day}</strong> (survival probability slips from {Math.round(data[steepestIdx].prob * 100)}% to {Math.round(data[steepestIdx + 1].prob * 100)}%).
          </div>

          <div className="w-full flex-1 flex items-center justify-center relative">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto max-h-[300px]">
              <defs>
                <linearGradient id="survivalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stopColor="#0284c7" stopOpacity="0.25" />
                  <stop offset="100%" stopColor="#0284c7" stopOpacity="0.02" />
                </linearGradient>
              </defs>

              {[1.0, 0.75, 0.5, 0.25, 0.0].map((p) => {
                const y = getY(p);
                return (
                  <g key={p}>
                    <line x1={padLeft} y1={y} x2={padLeft + plotW} y2={y} stroke="#f1f5f9" strokeDasharray="3 3" />
                    <text x={padLeft - 8} y={y + 3.5} textAnchor="end" fontSize="10" fill="#94a3b8" fontFamily="Inter, sans-serif">
                      {Math.round(p * 100)}%
                    </text>
                  </g>
                );
              })}

              <rect
                x={bandXStart}
                y={padTop}
                width={bandXEnd - bandXStart}
                height={plotH}
                fill="rgba(239, 68, 68, 0.10)"
                stroke="rgba(239, 68, 68, 0.25)"
                strokeDasharray="2 2"
              />
              <text
                x={(bandXStart + bandXEnd) / 2}
                y={padTop + 14}
                textAnchor="middle"
                fontSize="9"
                fontWeight="bold"
                fill="#dc2626"
              >
                High Stall Danger
              </text>

              <path d={areaPath} fill="url(#survivalGradient)" />
              <polyline
                fill="none"
                stroke="#0284c7"
                strokeWidth="2.5"
                strokeLinecap="round"
                strokeLinejoin="round"
                points={points}
              />

              {data.map((d, i) => {
                const cx = getX(i);
                const cy = getY(d.prob);
                const isHovered = hoveredPoint === i;
                const isCritical = i === steepestIdx || i === steepestIdx + 1;

                return (
                  <g key={d.day}>
                    <text
                      x={cx}
                      y={padTop + plotH + 18}
                      textAnchor="middle"
                      fontSize="9.5"
                      fill="#64748b"
                      fontFamily="Inter, sans-serif"
                    >
                      {d.label}
                    </text>

                    <circle
                      cx={cx}
                      cy={cy}
                      r={isHovered ? 6 : (isCritical ? 4.5 : 3.5)}
                      fill={isCritical ? "#ef4444" : "#0284c7"}
                      stroke="#ffffff"
                      strokeWidth="2"
                      className="cursor-pointer transition-all duration-200"
                      onMouseEnter={() => setHoveredPoint(i)}
                      onMouseLeave={() => setHoveredPoint(null)}
                    />

                    {isHovered && (
                      <g>
                        <rect
                          x={cx - 44}
                          y={cy - 30}
                          width="88"
                          height="22"
                          rx="4"
                          fill="#1e293b"
                          opacity="0.92"
                        />
                        <text
                          x={cx}
                          y={cy - 16}
                          textAnchor="middle"
                          fontSize="10"
                          fill="#ffffff"
                          fontWeight="bold"
                        >
                          {d.label}: {Math.round(d.prob * 100)}%
                        </text>
                      </g>
                    )}
                  </g>
                );
              })}
            </svg>
          </div>

          <div className="border-t border-gray-100 mt-3 pt-2.5">
            <p className="text-[11px] leading-relaxed text-gray-500 font-normal">
              <strong className="font-semibold text-gray-700">Survival Dynamics:</strong> The steepest drop shows when this project is most likely to face major delays. Shaded red region pinpoints the highest risk window.
            </p>
          </div>
        </div>
      );
    }

    /**
     * Complete XAI & Survival Dashboard
     */
    function XaiSurvivalDashboard() {
      const [selectedFactor, setSelectedFactor] = useState(null);

      const handleFactorClick = (factor) => {
        setSelectedFactor(factor);
      };

      return (
        <div className="w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-2 border-b border-gray-200">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="px-2 py-0.5 bg-blue-100 text-blue-800 text-[11px] font-bold rounded uppercase tracking-wider">
                  NEXUS-XAI Platform
                </span>
                <span className="text-gray-400 text-xs">Section 7: Dual-Paradigm Interpretability</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">
                XAI & Survival Analysis
              </h1>
              <p className="text-xs sm:text-sm text-gray-500 mt-1">
                Cross-sectional risk attribution comparing multidimensional spatial shapes with longitudinal survival dynamics.
              </p>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="/dashboard?tab=xai"
                className="px-3.5 py-1.5 text-xs font-semibold text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 transition-colors"
              >
                Back to Workbench
              </a>
              <button
                onClick={() => setSelectedFactor(null)}
                className="px-3.5 py-1.5 text-xs font-semibold text-white bg-blue-600 rounded-md shadow-sm hover:bg-blue-700 transition-colors"
              >
                Reset Focus
              </button>
            </div>
          </div>

          {/* Two-Column Responsive Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
            {/* Left Column: RiskFactorRadarChart (Risk Factor Profile) */}
            <RiskFactorRadarChart
              data={CURRENT_PROJECT_DATA}
              sourceBarData={CURRENT_PROJECT_DATA}
              title="Risk Factor Profile"
              subtitle="How this project compares to the portfolio average"
              onFactorClick={handleFactorClick}
            />

            {/* Right Column: When Is This Project Most Likely to Stall? Graph */}
            <ProjectSurvivalChart
              title="When Is This Project Most Likely to Stall?"
              subtitle="Likelihood this project stays on track over the next 2 years"
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<XaiSurvivalDashboard />);
  </script>
</body>
</html>
